<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mobeats CMS</title><link rel="stylesheet" href="style.css"></head><body><main class="cms"><div class="cms-head"><div><a class="logo" href="/">mo<span>beats</span></a><p class="eyebrow">MUSIC CMS</p><h1>Studio Control</h1></div><button class="pill" id="logout">Logout</button></div><section id="loginPanel" class="cms-card"><h2>Admin Login</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button class="primary" id="login">Einloggen</button><p id="status" class="hint"></p></section><section id="dashboard" hidden><div class="cms-grid"><article class="cms-card"><h2>Track</h2><input id="trackTitle" placeholder="Titel"><input id="trackSlug" placeholder="Slug"><select id="trackArtist"></select><input id="trackGenre" placeholder="Genre"><input id="trackBpm" type="number" placeholder="BPM"><label class="file"><input id="audioFile" type="file" accept="audio/mpeg,audio/mp3,audio/*">MP3 auswählen</label><label class="file"><input id="coverFile" type="file" accept="image/*">Cover auswählen</label><label class="check"><input id="published" type="checkbox"> öffentlich</label><button class="primary" id="saveTrack">Track speichern</button></article><article class="cms-card"><h2>Artist</h2><input id="artistName" placeholder="Artist Name"><input id="artistSlug" placeholder="Slug"><input id="artistGenre" placeholder="Genre"><textarea id="artistBio" placeholder="Bio"></textarea><button class="primary" id="saveArtist">Artist speichern</button></article><article class="cms-card"><h2>Playlist</h2><input id="playlistName" placeholder="Playlist Name"><input id="playlistSlug" placeholder="Slug"><input id="playlistDesc" placeholder="Beschreibung"><label class="check"><input id="playlistPublished" type="checkbox"> öffentlich</label><button class="primary" id="savePlaylist">Playlist speichern</button></article></div><div class="cms-card"><h2>Tracks</h2><div id="adminTracks"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="cms.js"></script></body></html>
